openapi: 3.1.0
info:
  title: Monitoring engine API
  version: 0.1.0
  summary: API-first monitoring engine by PlusClouds.
  description: |
    Every action is an API call. This spec is the source of truth (ADR-0007):
    Go server interfaces are generated from it.

    **Roles.** read-only reads everything. operator also acknowledges,
    comments, resolves, runs checks now, and configures what is monitored:
    sites, devices, checks, credentials, webhooks and alert routes. admin
    also manages API keys and members and reads the audit log.

    **Authentication.** `Authorization: Bearer <key>`.
    - A tenant API key acts in its own tenant with its role.
    - The platform key (used by the PlusClouds API) provisions tenants and
      users, and acts in a tenant named by `X-Tenant-External-ID` (or
      `X-Tenant-ID`) as the user named by `X-Actor-External-ID` (ADR-0012).
      Without an actor it acts as the platform with full rights in that
      tenant. Unknown tenants and users are created just in time.

    **Reference.** This document is served at `/v1/openapi.json` and
    `/v1/openapi.yaml`, and rendered at `/docs`, without authentication.

    **Errors** are RFC 9457 problem details (`application/problem+json`).
    **Timestamps** are RFC 3339 in UTC. **Lists** use cursor pagination.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: /v1

security:
  - bearer: []

tags:
  - name: identity
    description: The caller, its tenant and its API keys
  - name: provisioning
    description: Platform-only tenant, user and membership management (F01, ADR-0012)
  - name: audit
    description: The tenant's audit log
  - name: plugins
    description: Check, collector and ingester types this engine supports (F03)
  - name: sites
    description: Physical or logical locations (ADR-0014)
  - name: devices
    description: What is monitored, its containment tree and dependencies (F02, ADR-0014)
  - name: checks
    description: Plugin runs against a device on an interval (F02, F03)
  - name: credentials
    description: Encrypted device credentials; secrets are write-only (F02, ADR-0006)
  - name: incidents
    description: Check state and incidents (F05)
  - name: notifications
    description: Webhook endpoints, alert routes and deliveries (F06, ADR-0009)
  - name: metrics
    description: Stored check metrics, rollups and retention (F07, ADR-0003)
  - name: usage
    description: Billable usage for PlusClouds billing (F13)

paths:
  /me:
    get:
      operationId: getMe
      tags: [identity]
      summary: The resolved caller
      responses:
        "200":
          description: Tenant, user, role and key of this request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }

  /tenant:
    get:
      operationId: getTenant
      tags: [identity]
      summary: The caller's tenant, with its limits
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        default: { $ref: "#/components/responses/Problem" }

  /api-keys:
    get:
      operationId: listAPIKeys
      tags: [identity]
      summary: List the tenant's API keys
      description: Requires the admin role. `stale` lists keys unused for that long, plus keys without an expiry, for access reviews.
      parameters:
        - name: stale
          in: query
          description: Only keys unused for this many days, or never used, or without an expiry.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Keys (never the secret)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/APIKey" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAPIKey
      tags: [identity]
      summary: Create an API key
      description: Requires the admin role. The key is returned once and cannot be shown again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/APIKeyCreate" }
      responses:
        "201":
          description: The new key, including its secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyCreated" }
        default: { $ref: "#/components/responses/Problem" }

  /api-keys/{key_id}:
    delete:
      operationId: revokeAPIKey
      tags: [identity]
      summary: Revoke an API key
      parameters:
        - $ref: "#/components/parameters/KeyID"
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Problem" }

  /audit:
    get:
      operationId: listAuditEvents
      tags: [audit]
      summary: Query the tenant's audit log
      description: Requires the admin role. The query itself is audited (F01).
      parameters:
        - { name: object_type, in: query, schema: { type: string } }
        - { name: object_id, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Problem" }

  /plugins:
    get:
      operationId: listPlugins
      tags: [plugins]
      summary: List the plugins this engine was built with
      description: Any authenticated key. Clients render config forms from `config_schema`.
      responses:
        "200":
          description: Plugin manifests, sorted by type
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Plugin" }
        default: { $ref: "#/components/responses/Problem" }

  /plugins/{type}:
    get:
      operationId: getPlugin
      tags: [plugins]
      summary: One plugin's manifest
      parameters:
        - name: type
          in: path
          required: true
          schema: { type: string, examples: [icmp, http, snmp.interfaces] }
      responses:
        "200":
          description: The manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        default: { $ref: "#/components/responses/Problem" }

  /tenants:
    get:
      operationId: listTenants
      tags: [provisioning]
      summary: List tenants (platform only)
      description: |
        Used by the PlusClouds reconciliation job. To read one tenant without
        writing it, filter by its external ID: `?external_source=plusclouds&external_id=<account uuid>`
        returns it as the only item, or no items. This never creates a tenant.
      parameters:
        - { name: external_source, in: query, schema: { type: string } }
        - { name: external_id, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Tenant" }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Problem" }

  /tenants/by-external-id/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalID"
      - $ref: "#/components/parameters/ExternalSource"
    put:
      operationId: upsertTenant
      tags: [provisioning]
      summary: Create or update a tenant by its external ID (platform only)
      description: Idempotent. A call that changes nothing writes no audit event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantUpsert" }
      responses:
        "200":
          description: Updated or unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchTenant
      tags: [provisioning]
      summary: Change a tenant's name, status or limits (platform only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantPatch" }
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteTenant
      tags: [provisioning]
      summary: Soft-delete a tenant (platform only)
      description: |
        Checks stop and the API returns 404 for it. Until the platform's
        purge grace (default 30 days) has passed, `POST …/restore` brings it
        back intact. After that its data is purged, its audit log is kept,
        and the external ID can be used for a new tenant.
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }

  /tenants/by-external-id/{external_id}/restore:
    parameters:
      - $ref: "#/components/parameters/ExternalID"
      - $ref: "#/components/parameters/ExternalSource"
    post:
      operationId: restoreTenant
      tags: [provisioning]
      summary: Undelete a deleted tenant (platform only)
      description: |
        The tenant becomes active with its devices, checks, webhooks and
        history; checks start again. A tenant that is not deleted is
        returned unchanged. 404 once the tenant has been purged.
      responses:
        "200":
          description: The tenant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        default: { $ref: "#/components/responses/Problem" }

  /tenants/{tenant_id}/members:
    get:
      operationId: listMembers
      tags: [provisioning]
      summary: List a tenant's members (platform only)
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Problem" }

  /tenants/{tenant_id}/members/by-external-id/{user_external_id}:
    parameters:
      - $ref: "#/components/parameters/TenantID"
      - name: user_external_id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 200 }
      - $ref: "#/components/parameters/ExternalSource"
    put:
      operationId: upsertMember
      tags: [provisioning]
      summary: Add a user to a tenant or change its role (platform only)
      description: Creates the user mirror row when needed. Idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpsert" }
      responses:
        "200":
          description: Updated or unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: removeMember
      tags: [provisioning]
      summary: Remove a user from a tenant (platform only)
      responses:
        "204": { description: Removed, or was not a member }
        default: { $ref: "#/components/responses/Problem" }

  /users/by-external-id/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalID"
      - $ref: "#/components/parameters/ExternalSource"
    patch:
      operationId: patchUser
      tags: [provisioning]
      summary: Disable or rename a user everywhere (platform only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPatch" }
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Problem" }

  /credential-types:
    get:
      operationId: listCredentialTypes
      tags: [credentials]
      summary: Credential types and their fields
      description: Any authenticated key. `fields_schema` marks secret fields `writeOnly`.
      responses:
        "200":
          description: Types, sorted by name
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CredentialType" }
        default: { $ref: "#/components/responses/Problem" }

  /credentials:
    get:
      operationId: listCredentials
      tags: [credentials]
      summary: List credentials (never their secrets)
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/FilterExternalSource"
        - $ref: "#/components/parameters/FilterExternalType"
        - $ref: "#/components/parameters/FilterExternalID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Credentials ordered by ID
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCredential
      tags: [credentials]
      summary: Store a credential
      description: Requires the operator role. Secret fields are encrypted at rest and never returned (ADR-0006).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        default: { $ref: "#/components/responses/Problem" }

  /credentials/by-external-id/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalID"
      - $ref: "#/components/parameters/ExternalSource"
      - $ref: "#/components/parameters/ExternalType"
    put:
      operationId: upsertCredential
      tags: [credentials]
      summary: Create or replace a credential by its external ID
      description: |
        Idempotent. On update, non-secret fields are replaced and secret
        fields that are not sent keep their value. The type cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialWrite" }
      responses:
        "200":
          description: Updated or unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        default: { $ref: "#/components/responses/Problem" }

  /credentials/{credential_id}:
    parameters:
      - $ref: "#/components/parameters/CredentialID"
    get:
      operationId: getCredential
      tags: [credentials]
      summary: One credential (never its secrets)
      responses:
        "200":
          description: The credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateCredential
      tags: [credentials]
      summary: Replace a credential's name and fields
      description: Secret fields that are not sent keep their value. The type cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialWrite" }
      responses:
        "200":
          description: The credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCredential
      tags: [credentials]
      summary: Delete a credential that no check uses
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }

  /sites:
    get:
      operationId: listSites
      tags: [sites]
      summary: List sites
      parameters:
        - $ref: "#/components/parameters/FilterExternalSource"
        - $ref: "#/components/parameters/FilterExternalType"
        - $ref: "#/components/parameters/FilterExternalID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Sites ordered by ID
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Site" }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createSite
      tags: [sites]
      summary: Add a site
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        default: { $ref: "#/components/responses/Problem" }

  /sites/by-external-id/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalID"
      - $ref: "#/components/parameters/ExternalSource"
      - $ref: "#/components/parameters/ExternalType"
    patch:
      operationId: patchSiteByExternalID
      tags: [sites]
      summary: Change some fields of a site found by its external ID
      requestBody:
        required: true
        description: |
          JSON Merge Patch (RFC 7396) of SiteWrite: a field left out stays as it
          is, null clears an optional field. The result is validated like a PUT.
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/MergePatch" }
          application/json:
            schema: { $ref: "#/components/schemas/MergePatch" }
      responses:
        "200":
          description: The site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: upsertSite
      tags: [sites]
      summary: Create or replace a site by its external ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteWrite" }
      responses:
        "200":
          description: Updated or unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        default: { $ref: "#/components/responses/Problem" }

  /sites/{site_id}:
    parameters:
      - $ref: "#/components/parameters/SiteID"
    get:
      operationId: getSite
      tags: [sites]
      summary: One site
      responses:
        "200":
          description: The site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchSite
      tags: [sites]
      summary: Change some fields of a site
      requestBody:
        required: true
        description: |
          JSON Merge Patch (RFC 7396) of SiteWrite: a field left out stays as it
          is, null clears an optional field. The result is validated like a PUT.
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/MergePatch" }
          application/json:
            schema: { $ref: "#/components/schemas/MergePatch" }
      responses:
        "200":
          description: The site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateSite
      tags: [sites]
      summary: Replace a site
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteWrite" }
      responses:
        "200":
          description: The site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Site" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteSite
      tags: [sites]
      summary: Delete a site without devices
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }

  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List devices
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: site_id, in: query, schema: { type: string, format: uuid } }
        - { name: parent_id, in: query, schema: { type: string, format: uuid } }
        - name: availability
          in: query
          description: Only devices with one of these availabilities; repeat for several.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/Availability" }
        - name: tag
          in: query
          description: "`key=value`; repeat for several tags, all must match."
          style: form
          explode: true
          schema:
            type: array
            items: { type: string, pattern: "^[^=]+=.*$" }
        - $ref: "#/components/parameters/FilterExternalSource"
        - $ref: "#/components/parameters/FilterExternalType"
        - $ref: "#/components/parameters/FilterExternalID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Devices ordered by ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createDevice
      tags: [devices]
      summary: Add a device
      description: Requires the operator role. Counts against the tenant's `max_devices`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        default: { $ref: "#/components/responses/Problem" }

  /devices/by-external-id/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalID"
      - $ref: "#/components/parameters/ExternalSource"
      - $ref: "#/components/parameters/ExternalType"
    patch:
      operationId: patchDeviceByExternalID
      tags: [devices]
      summary: Change some fields of a device found by its external ID
      description: 404 when no device has this external ID; never creates one.
      requestBody:
        required: true
        description: |
          JSON Merge Patch (RFC 7396) of DeviceWrite: a field left out stays as it
          is, null clears an optional field, and objects (tags, external) merge key by
          key. The result is validated like a PUT.
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/MergePatch" }
          application/json:
            schema: { $ref: "#/components/schemas/MergePatch" }
      responses:
        "200":
          description: The device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: upsertDevice
      tags: [devices]
      summary: Create or replace a device by its external ID
      description: Idempotent. A call that changes nothing writes no audit event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceWrite" }
      responses:
        "200":
          description: Updated or unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        default: { $ref: "#/components/responses/Problem" }

  /devices/{device_id}:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      operationId: getDevice
      tags: [devices]
      summary: One device
      responses:
        "200":
          description: The device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchDevice
      tags: [devices]
      summary: Change some fields of a device
      requestBody:
        required: true
        description: |
          JSON Merge Patch (RFC 7396) of DeviceWrite: a field left out stays as it
          is, null clears an optional field, and objects (tags, external) merge key by
          key. The result is validated like a PUT.
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/MergePatch" }
          application/json:
            schema: { $ref: "#/components/schemas/MergePatch" }
      responses:
        "200":
          description: The device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateDevice
      tags: [devices]
      summary: Replace a device
      description: Devices discovered by a collector accept changes to tags, notes and external IDs only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceWrite" }
      responses:
        "200":
          description: The device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDevice
      tags: [devices]
      summary: Delete a device, its checks and the devices it contains
      parameters:
        - name: confirm
          in: query
          description: Required when the device contains other devices.
          schema: { type: boolean, default: false }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }

  /devices/{device_id}/children:
    get:
      operationId: listDeviceChildren
      tags: [devices]
      summary: Devices this device contains
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Child devices ordered by ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePage" }
        default: { $ref: "#/components/responses/Problem" }

  /devices/{device_id}/dependencies:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      operationId: listDeviceDependencies
      tags: [devices]
      summary: What this device needs to work, directly
      description: Stored dependencies plus its container (`source` = `containment`), ADR-0014.
      responses:
        "200":
          description: Direct dependencies
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DependencyList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: addDeviceDependency
      tags: [devices]
      summary: Record that this device needs another one
      description: Cycles are rejected. Adding an existing dependency changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [depends_on_id]
              properties:
                depends_on_id: { type: string, format: uuid }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dependency" }
        "200":
          description: Already present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dependency" }
        default: { $ref: "#/components/responses/Problem" }

  /devices/{device_id}/dependencies/{depends_on_id}:
    delete:
      operationId: removeDeviceDependency
      tags: [devices]
      summary: Remove a stored dependency
      parameters:
        - $ref: "#/components/parameters/DeviceID"
        - name: depends_on_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Removed, or was not present }
        default: { $ref: "#/components/responses/Problem" }

  /devices/{device_id}/dependents:
    get:
      operationId: listDeviceDependents
      tags: [devices]
      summary: Devices that need this device, directly
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200":
          description: Direct dependents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DependencyList" }
        default: { $ref: "#/components/responses/Problem" }

  /devices/{device_id}/impact:
    get:
      operationId: getDeviceImpact
      tags: [devices]
      summary: Every device that would be suppressed if this one failed
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200":
          description: Dependent devices, nearest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [device, distance]
                      properties:
                        device: { $ref: "#/components/schemas/Device" }
                        distance: { type: integer, description: "Edges between the two devices" }
        default: { $ref: "#/components/responses/Problem" }

  /devices/{device_id}/test:
    post:
      operationId: testDevice
      tags: [devices]
      summary: Run every enabled check of the device once
      description: |
        Requires the operator role. Runs synchronously (at most 60 s) and
        returns raw results. Results are not stored and do not change state.
      parameters:
        - $ref: "#/components/parameters/DeviceID"
      responses:
        "200":
          description: One result per enabled check
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CheckRun" }
        default: { $ref: "#/components/responses/Problem" }

  /devices/{device_id}/checks:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      operationId: listDeviceChecks
      tags: [checks]
      summary: The device's checks
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Checks ordered by ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckPage" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createCheck
      tags: [checks]
      summary: Add a check to the device
      description: |
        Requires the operator role. The config is validated against the
        plugin's schema; the interval must respect the plugin's and the
        tenant's minimum. Counts against the tenant's `max_checks`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        default: { $ref: "#/components/responses/Problem" }

  /checks:
    get:
      operationId: listChecks
      tags: [checks]
      summary: List checks
      parameters:
        - { name: device_id, in: query, schema: { type: string, format: uuid } }
        - { name: plugin, in: query, schema: { type: string } }
        - { name: enabled, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Checks ordered by ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckPage" }
        default: { $ref: "#/components/responses/Problem" }

  /checks/{check_id}:
    parameters:
      - $ref: "#/components/parameters/CheckID"
    get:
      operationId: getCheck
      tags: [checks]
      summary: One check
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: patchCheck
      tags: [checks]
      summary: Change some fields of a check
      requestBody:
        required: true
        description: |
          JSON Merge Patch (RFC 7396) of CheckWrite: a field left out stays as it
          is, null clears an optional field, and objects (config, credentials; thresholds is replaced whole) merge key by
          key. The result is validated like a PUT.
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/MergePatch" }
          application/json:
            schema: { $ref: "#/components/schemas/MergePatch" }
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateCheck
      tags: [checks]
      summary: Replace a check
      description: The plugin cannot change. Omitted optional fields return to their defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckWrite" }
      responses:
        "200":
          description: The check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteCheck
      tags: [checks]
      summary: Delete a check
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }

  /checks/{check_id}/state:
    get:
      operationId: getCheckState
      tags: [incidents]
      summary: The check's current state
      description: 404 with problem type `no-state` until the check's first result.
      parameters:
        - $ref: "#/components/parameters/CheckID"
      responses:
        "200":
          description: State
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckState" }
        default: { $ref: "#/components/responses/Problem" }

  /checks/{check_id}/whoopsy:
    get:
      operationId: getWhoopsy
      tags: [checks]
      summary: Whoopsy! settings and the current band
      parameters:
        - $ref: "#/components/parameters/CheckID"
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoopsyStatus" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: enableWhoopsy
      tags: [checks]
      summary: Turn Whoopsy! on, or change its settings
      description: |
        Requires the operator role. Every field is optional; the defaults
        are a window of 7 results, 1 standard deviation, 3 results in a row,
        above the band, warning. Collectors are refused. Billing changes
        from the moment it is turned on (`<plugin>+whoopsy`).
      parameters:
        - $ref: "#/components/parameters/CheckID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Whoopsy" }
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoopsyStatus" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: disableWhoopsy
      tags: [checks]
      summary: Turn Whoopsy! off
      description: Requires the operator role. An open Whoopsy! incident resolves with the check's next result.
      parameters:
        - $ref: "#/components/parameters/CheckID"
      responses:
        "204": { description: Off }
        default: { $ref: "#/components/responses/Problem" }

  /checks/{check_id}/whoopsy/band:
    get:
      operationId: getWhoopsyBand
      tags: [checks]
      summary: The Whoopsy! band of every result, for graphs
      description: |
        One point per result while Whoopsy! was on, with the band the engine
        judged that result against: the mean and sample standard deviation
        of the window before it (the result itself excluded, values that
        broke the band left out, as the engine does), and the edges with
        `deviations`, `min_delta` and `direction` applied, under the
        settings in force at that time. `mean`, `stddev`, `lower` and
        `upper` are null while the band is learning; `lower` is null for
        direction `above` and `upper` for `below`. Kept for
        `metrics.whoopsy_band_retention` (7 days by default). At most 7 days
        and 20,000 points per request (422 otherwise). The last hour, the
        default, is cheap enough to poll every 30 seconds.
      parameters:
        - $ref: "#/components/parameters/CheckID"
        - { name: from, in: query, description: "Default: an hour before `to`", schema: { type: string, format: date-time } }
        - { name: to, in: query, description: "Default: now", schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Band points, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [check_id, from, to, points]
                properties:
                  check_id: { type: string, format: uuid }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  points:
                    type: array
                    items:
                      type: object
                      required: [t, value, mean, stddev, lower, upper, outside, hits, alerting]
                      properties:
                        t: { type: string, format: date-time, description: "The result's time" }
                        value: { type: number, format: double }
                        mean: { type: [number, "null"], format: double }
                        stddev: { type: [number, "null"], format: double }
                        lower: { type: [number, "null"], format: double }
                        upper: { type: [number, "null"], format: double }
                        outside: { type: boolean, description: The result broke the band }
                        hits: { type: integer, description: Results in a row outside the band, this one included }
                        alerting: { type: boolean, description: "Whoopsy! was alerting after this result" }
        default: { $ref: "#/components/responses/Problem" }

  /checks/{check_id}/whoopsy/reset:
    post:
      operationId: resetWhoopsy
      tags: [checks]
      summary: Forget the learned band (accept a new normal)
      description: |
        Requires the operator role. The band is frozen while results break
        it, so a lasting change (a deploy that makes responses slower for
        good) keeps alerting until someone accepts it. Reset clears the
        window: the band is learned again from the next `window` results,
        and an open Whoopsy! incident resolves with the next result. 409
        `whoopsy-off` when Whoopsy! is off.
      parameters:
        - $ref: "#/components/parameters/CheckID"
      responses:
        "200":
          description: Status after the reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoopsyStatus" }
        default: { $ref: "#/components/responses/Problem" }

  /checks/{check_id}/rotate-token:
    post:
      operationId: rotatePushToken
      tags: [checks]
      summary: Replace a push check's ingest token
      description: |
        Requires the configuration role. The old token stops working at
        once; the new one is in `push_token`, shown only in this response.
        409 `not-push` for a check that is not a push check.
      parameters:
        - $ref: "#/components/parameters/CheckID"
      responses:
        "200":
          description: The check with its new token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Check" }
        default: { $ref: "#/components/responses/Problem" }

  /checks/{check_id}/objects:
    get:
      operationId: listCheckObjects
      tags: [incidents]
      summary: The objects of a collector check and their state
      description: |
        A collector (such as `snmp.interfaces`) reports objects: interfaces,
        fans, disks. Each has its own status, metrics, thresholds and
        incidents. Objects the device stopped reporting have `gone_at` and
        are listed for 30 days, unless `include_gone=false`. A check that is
        not a collector has no objects.
      parameters:
        - $ref: "#/components/parameters/CheckID"
        - name: status
          in: query
          schema: { type: string, enum: [OK, WARNING, CRITICAL, UNKNOWN] }
        - name: include_gone
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Objects, by key
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CheckObject" }
        default: { $ref: "#/components/responses/Problem" }

  /checks/{check_id}/run-now:
    post:
      operationId: runCheckNow
      tags: [checks]
      summary: Run the check at once
      description: |
        Requires the operator role. The active runner starts the check within
        about a second; the result goes through the normal pipeline (state,
        incidents). A check that is already running is not started twice.
      parameters:
        - $ref: "#/components/parameters/CheckID"
      responses:
        "202": { description: Requested }
        default: { $ref: "#/components/responses/Problem" }

  /incidents:
    get:
      operationId: listIncidents
      tags: [incidents]
      summary: List incidents, newest first
      parameters:
        - name: status
          in: query
          description: "`active` is open or acknowledged."
          schema: { type: string, enum: [open, acknowledged, resolved, active] }
        - { name: severity, in: query, schema: { type: string, enum: [warning, critical] } }
        - { name: device_id, in: query, schema: { type: string, format: uuid } }
        - { name: check_id, in: query, schema: { type: string, format: uuid } }
        - name: suppressed
          in: query
          description: "`false` lists only incidents that were notified; `true` only those an upstream failure explains."
          schema: { type: boolean }
        - name: object_key
          in: query
          description: Incidents of one object of a collector check (an interface, a fan).
          schema: { type: string, maxLength: 200 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Incident" }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Problem" }

  /incidents/{incident_id}:
    get:
      operationId: getIncident
      tags: [incidents]
      summary: One incident with its comments
      parameters:
        - $ref: "#/components/parameters/IncidentID"
      responses:
        "200":
          description: The incident
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Incident"
                  - type: object
                    required: [comments]
                    properties:
                      comments:
                        type: array
                        items: { $ref: "#/components/schemas/IncidentComment" }
        default: { $ref: "#/components/responses/Problem" }

  /incidents/{incident_id}/ack:
    post:
      operationId: acknowledgeIncident
      tags: [incidents]
      summary: Acknowledge an incident
      description: Requires the operator role. Escalation stops; the incident stays open until recovery.
      parameters:
        - $ref: "#/components/parameters/IncidentID"
      responses:
        "200":
          description: The incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        default: { $ref: "#/components/responses/Problem" }

  /incidents/{incident_id}/resolve:
    post:
      operationId: resolveIncident
      tags: [incidents]
      summary: Resolve an incident by hand
      description: |
        Requires the operator role. The check's state starts over; if the
        problem persists, a new incident opens after `failure_count` results.
      parameters:
        - $ref: "#/components/parameters/IncidentID"
      responses:
        "200":
          description: The incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        default: { $ref: "#/components/responses/Problem" }

  /incidents/{incident_id}/comments:
    post:
      operationId: commentIncident
      tags: [incidents]
      summary: Add a comment to an incident
      description: Requires the operator role.
      parameters:
        - $ref: "#/components/parameters/IncidentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 10000 }
      responses:
        "201":
          description: The comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentComment" }
        default: { $ref: "#/components/responses/Problem" }

  /webhooks:
    get:
      operationId: listWebhooks
      tags: [notifications]
      summary: List webhook endpoints
      responses:
        "200":
          description: Endpoints by name (never their secrets or header values)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWebhook
      tags: [notifications]
      summary: Add a webhook endpoint
      description: Requires the operator role. The response carries the signing secret once (ADR-0009).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookWrite" }
      responses:
        "201":
          description: Created, with the signing secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookWithSecret" }
        default: { $ref: "#/components/responses/Problem" }

  /webhooks/by-external-id/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalID"
      - $ref: "#/components/parameters/ExternalSource"
      - $ref: "#/components/parameters/ExternalType"
    put:
      operationId: upsertWebhook
      tags: [notifications]
      summary: Create or replace a webhook endpoint by its external ID
      description: "`secret` is set only when the endpoint is created."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookWrite" }
      responses:
        "200":
          description: Updated or unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookWithSecret" }
        "201":
          description: Created, with the signing secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookWithSecret" }
        default: { $ref: "#/components/responses/Problem" }

  /webhooks/{webhook_id}:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    get:
      operationId: getWebhook
      tags: [notifications]
      summary: One webhook endpoint
      responses:
        "200":
          description: The endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateWebhook
      tags: [notifications]
      summary: Replace a webhook endpoint
      description: Headers that are not sent keep their values; send a header as null to remove it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookWrite" }
      responses:
        "200":
          description: The endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteWebhook
      tags: [notifications]
      summary: Delete a webhook endpoint no route uses
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }

  /webhooks/{webhook_id}/test:
    post:
      operationId: testWebhook
      tags: [notifications]
      summary: Send a signed monitoring.webhook.test event now
      description: Requires the operator role. Returns what the receiver answered.
      parameters:
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "200":
          description: The attempt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookAttempt" }
        default: { $ref: "#/components/responses/Problem" }

  /webhooks/{webhook_id}/rotate-secret:
    post:
      operationId: rotateWebhookSecret
      tags: [notifications]
      summary: Replace the signing secret
      description: |
        Requires the operator role. Deliveries carry signatures with the old and
        the new secret until `previous_valid_until`, so receivers can switch
        without losing events.
      parameters:
        - $ref: "#/components/parameters/WebhookID"
      responses:
        "200":
          description: The endpoint with its new secret, shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookWithSecret" }
        default: { $ref: "#/components/responses/Problem" }

  /webhooks/{webhook_id}/deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [notifications]
      summary: The endpoint's delivery log, newest first
      parameters:
        - $ref: "#/components/parameters/WebhookID"
        - name: status
          in: query
          schema: { type: string, enum: [pending, delivered, failed, cancelled] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Problem" }

  /webhooks/{webhook_id}/deliveries/{delivery_id}/replay:
    post:
      operationId: replayWebhookDelivery
      tags: [notifications]
      summary: Send a delivery again
      description: Requires the operator role. The delivery is queued again with a fresh 24-hour retry window.
      parameters:
        - $ref: "#/components/parameters/WebhookID"
        - name: delivery_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        default: { $ref: "#/components/responses/Problem" }

  /webhooks/{webhook_id}/deliveries/replay:
    post:
      operationId: replayWebhookDeliveries
      tags: [notifications]
      summary: Send an endpoint's failed deliveries again, in bulk
      description: |
        Requires the operator role. Queues every delivery of the endpoint
        with the given status, created in [from, to), again with a fresh
        24-hour retry window, in their original order. For catching up after
        a receiver outage longer than the retry window. At most 10,000 per call.
      parameters:
        - $ref: "#/components/parameters/WebhookID"
        - { name: status, in: query, schema: { type: string, enum: [failed, cancelled], default: failed } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [replayed]
                properties:
                  replayed: { type: integer }
        default: { $ref: "#/components/responses/Problem" }

  /alert-routes/test:
    post:
      operationId: testAlertRoutes
      tags: [notifications]
      summary: Which routes a sample incident would reach
      description: |
        Evaluates the tenant's routes against an incident event built from a
        real device and check, without sending anything. `notifies` is true
        for routes that would deliver: enabled, matching, reached (no earlier
        match without `continue`) and with an enabled endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                event_type:
                  type: string
                  enum: [monitoring.incident.opened, monitoring.incident.updated, monitoring.incident.acknowledged,
                         monitoring.incident.resolved, monitoring.incident.commented]
                  default: monitoring.incident.opened
                severity: { type: string, enum: [warning, critical], default: critical }
                device_id: { type: string, format: uuid }
                check_id: { type: string, format: uuid, description: "Its device is used when device_id is left out" }
      responses:
        "200":
          description: Every route in evaluation order
          content:
            application/json:
              schema:
                type: object
                required: [routes]
                properties:
                  routes:
                    type: array
                    items: { $ref: "#/components/schemas/RouteTestResult" }
        default: { $ref: "#/components/responses/Problem" }

  /alert-routes:
    get:
      operationId: listAlertRoutes
      tags: [notifications]
      summary: List alert routes in evaluation order
      responses:
        "200":
          description: Routes by position
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AlertRoute" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAlertRoute
      tags: [notifications]
      summary: Add an alert route
      description: Requires the operator role. Without a position, the route is evaluated last.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRouteWrite" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRoute" }
        default: { $ref: "#/components/responses/Problem" }

  /alert-routes/by-external-id/{external_id}:
    parameters:
      - $ref: "#/components/parameters/ExternalID"
      - $ref: "#/components/parameters/ExternalSource"
      - $ref: "#/components/parameters/ExternalType"
    put:
      operationId: upsertAlertRoute
      tags: [notifications]
      summary: Create or replace an alert route by its external ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRouteWrite" }
      responses:
        "200":
          description: Updated or unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRoute" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRoute" }
        default: { $ref: "#/components/responses/Problem" }

  /alert-routes/{route_id}:
    parameters:
      - $ref: "#/components/parameters/RouteID"
    get:
      operationId: getAlertRoute
      tags: [notifications]
      summary: One alert route
      responses:
        "200":
          description: The route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRoute" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: updateAlertRoute
      tags: [notifications]
      summary: Replace an alert route
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRouteWrite" }
      responses:
        "200":
          description: The route
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertRoute" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteAlertRoute
      tags: [notifications]
      summary: Delete an alert route
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }

  /metrics/series:
    get:
      operationId: listMetricSeries
      tags: [metrics]
      summary: List stored metric series of a device or check
      description: |
        A series is one metric of one check. When a plugin's metric layout
        or the retention class changes, a new series with the same name
        starts; queries merge them by check, object and name.
      parameters:
        - $ref: "#/components/parameters/MetricDeviceID"
        - $ref: "#/components/parameters/MetricCheckID"
        - $ref: "#/components/parameters/MetricName"
        - $ref: "#/components/parameters/MetricObject"
      responses:
        "200":
          description: Series, at most 200
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MetricSeries" }
        default: { $ref: "#/components/responses/Problem" }

  /metrics/query:
    get:
      operationId: queryMetrics
      tags: [metrics]
      summary: Points of the selected series
      description: |
        Buckets of `step` seconds, aggregated with `agg`. Buckets start at
        multiples of `step` since 2000-01-01T00:00:00Z, so the first one may
        begin before `from`.
        Without `resolution`, the store picks raw samples for steps under
        5 minutes, 5-minute rollups for steps under an hour and hourly
        rollups above, and a coarser level when the finer one's retention
        no longer covers `from`. Recent buckets the rollups have not reached
        yet are read from the finer level. At most 10,000 points per series.
      parameters:
        - $ref: "#/components/parameters/MetricDeviceID"
        - $ref: "#/components/parameters/MetricCheckID"
        - $ref: "#/components/parameters/MetricName"
        - $ref: "#/components/parameters/MetricObject"
        - { name: from, in: query, description: "Default: an hour before `to`", schema: { type: string, format: date-time } }
        - { name: to, in: query, description: "Default: now", schema: { type: string, format: date-time } }
        - name: step
          in: query
          description: Bucket size in seconds. Default gives about 500 points, at least 10 s.
          schema: { type: integer, minimum: 1 }
        - name: agg
          in: query
          description: |
            `avg`, `min`, `max` and `sum` work at every resolution. `stddev`
            (sample standard deviation) and percentiles (`p50`, `p95`,
            `p99`, any `p<n>` with up to three decimals such as `p99.9`) are
            computed from the raw samples in each bucket, never from
            rollups: `from` must be within raw retention (422 on `from`
            otherwise), `resolution` other than `raw` is refused, and a
            request may read at most 2,000,000 raw samples. Buckets where
            the value is undefined (a deviation of one sample) are left out.
          schema: { type: string, pattern: '^(avg|min|max|sum|stddev|p[0-9]{1,2}(\.[0-9]{1,3})?)$', default: avg }
        - { name: resolution, in: query, schema: { type: string, enum: [raw, 5m, 1h] } }
        - name: moving_window
          in: query
          description: |
            Moving average over points: every point becomes the mean of
            itself and the `moving_window - 1` points before it (fewer at
            the start). Applied after `agg`.
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: Series with points
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricQueryResult" }
        default: { $ref: "#/components/responses/Problem" }

  /metrics/summary:
    get:
      operationId: summarizeMetrics
      tags: [metrics]
      summary: Statistics of the selected series over the whole window
      description: |
        One set of statistics per metric (merged across layout changes, like
        `/metrics/query`), computed from raw samples, so every value is
        exact. `from` must be within raw retention (422 on `from`
        otherwise), and a request may read at most 2,000,000 raw samples
        (422). The last hour, the default, is cheap enough to poll every
        30 seconds.
      parameters:
        - $ref: "#/components/parameters/MetricDeviceID"
        - $ref: "#/components/parameters/MetricCheckID"
        - $ref: "#/components/parameters/MetricName"
        - $ref: "#/components/parameters/MetricObject"
        - { name: from, in: query, description: "Default: an hour before `to`", schema: { type: string, format: date-time } }
        - { name: to, in: query, description: "Default: now", schema: { type: string, format: date-time } }
        - name: percentile
          in: query
          description: Extra percentiles besides p50, p95 and p99, such as `p90` or `p99.9`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 10
            items: { type: string, pattern: '^p[0-9]{1,2}(\.[0-9]{1,3})?$' }
        - name: window
          in: query
          description: Also report the mean and standard deviation of the last `window` samples (the Whoopsy! band).
          schema: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          description: Statistics per metric
          content:
            application/json:
              schema:
                type: object
                required: [resolution, exact, from, to, series]
                properties:
                  resolution: { type: string, enum: [raw] }
                  exact: { type: boolean, description: "Always true: computed from raw samples" }
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  series:
                    type: array
                    items: { $ref: "#/components/schemas/MetricSummary" }
        default: { $ref: "#/components/responses/Problem" }

  /metrics/retention-classes:
    get:
      operationId: listRetentionClasses
      tags: [metrics]
      summary: Retention classes and how long each level is kept
      description: |
        Retention is platform-wide per class, because partitions are shared
        by all tenants. A tenant's `metric_classes` limit decides which
        classes its checks store into: the plugin's class when allowed,
        else `standard`, else the tenant's first class.
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RetentionClass" }
        default: { $ref: "#/components/responses/Problem" }

  /metrics/retention-classes/{name}:
    put:
      operationId: putRetentionClass
      tags: [metrics]
      summary: Create a retention class or replace its retention (platform only)
      description: |
        A null or missing level is kept until a policy is set. The next
        maintenance run (hourly) drops partitions older than the new
        retention. Rollups need the level below: 5-minute retention may not
        be shorter than raw, hourly not shorter than 5-minute.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,39}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionWrite" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionClass" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionClass" }
        default: { $ref: "#/components/responses/Problem" }

  /usage/tenants:
    get:
      operationId: listTenantUsage
      tags: [usage]
      summary: Billable usage of every tenant per closed hour (platform only)
      description: |
        The contract PlusClouds billing pulls (F13). One item per tenant
        per closed UTC hour with billable checks, ordered by hour and
        account. `billable_check_seconds` is Σ(seconds a check was billable
        in the hour × its plugin's weight); the breakdown shows the
        unweighted seconds and weight per plugin. Only the latest revision
        of an hour is returned; a revision changes only for a correction.

        `from` and `to` must be whole UTC hours, at most 31 days apart. A
        range that reaches an hour not closed yet returns 422 with type
        `usage-hour-open`; its detail names the end of the closed hours.
        Hours are closed 5 minutes after they end.
      parameters:
        - $ref: "#/components/parameters/UsageFrom"
        - $ref: "#/components/parameters/UsageTo"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UsageHour" }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Problem" }

  /usage/hours:
    get:
      operationId: listUsageHours
      tags: [usage]
      summary: The tenant's own closed hours
      description: Same item shape as `/usage/tenants`, including hours without billable checks.
      parameters:
        - $ref: "#/components/parameters/UsageFrom"
        - $ref: "#/components/parameters/UsageTo"
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/UsageHour" }
        default: { $ref: "#/components/responses/Problem" }

  /usage/current:
    get:
      operationId: getCurrentUsage
      tags: [usage]
      summary: Checks billable right now, weighted (an estimate, not billable)
      responses:
        "200":
          description: Current usage
          content:
            application/json:
              schema:
                type: object
                required: [checks, weighted_checks, by_plugin]
                properties:
                  checks: { type: integer }
                  weighted_checks: { type: number, format: double }
                  by_plugin:
                    type: object
                    additionalProperties:
                      type: object
                      required: [checks, weight]
                      properties:
                        checks: { type: integer }
                        weight: { type: number, format: double }
        default: { $ref: "#/components/responses/Problem" }

  /usage/weights:
    get:
      operationId: getUsageWeights
      tags: [usage]
      summary: Billing weight per plugin in force now
      description: Set by the operator in the server config (`usage.weights`); read-only here.
      responses:
        "200":
          description: Weights
          content:
            application/json:
              schema:
                type: object
                required: [default_weight, whoopsy_multiplier, weights]
                properties:
                  default_weight: { type: number, format: double }
                  whoopsy_multiplier:
                    type: number
                    format: double
                    description: A check with Whoopsy! on weighs its plugin's weight times this, unless `weights` has `<plugin>+whoopsy`.
                  weights:
                    type: object
                    description: By plugin type; `<plugin>+whoopsy` keys override the multiplier for that plugin.
                    additionalProperties: { type: number, format: double }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An API key `mon_<prefix>_<secret>`.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor` of the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    KeyID:
      name: key_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExternalID:
      name: external_id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    ExternalSource:
      name: source
      in: query
      description: System the external ID belongs to. Default is the platform's identity source (`plusclouds`).
      schema: { type: string, minLength: 1, maxLength: 50 }

    ExternalType:
      name: type
      in: query
      description: Object type in the external system. Without it, a lookup matches any type.
      schema: { type: string, minLength: 1, maxLength: 200 }
    FilterExternalSource:
      name: external_source
      in: query
      schema: { type: string }
    FilterExternalType:
      name: external_type
      in: query
      schema: { type: string }
    FilterExternalID:
      name: external_id
      in: query
      schema: { type: string }
    CredentialID:
      name: credential_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SiteID:
      name: site_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceID:
      name: device_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CheckID:
      name: check_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    WebhookID:
      name: webhook_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RouteID:
      name: route_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncidentID:
      name: incident_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UsageFrom:
      name: from
      in: query
      required: true
      description: Start of the first hour, a whole UTC hour.
      schema: { type: string, format: date-time }
    UsageTo:
      name: to
      in: query
      required: true
      description: End of the last hour (exclusive), a whole UTC hour.
      schema: { type: string, format: date-time }
    MetricDeviceID:
      name: device_id
      in: query
      description: A device_id or a check_id is required.
      schema: { type: string, format: uuid }
    MetricCheckID:
      name: check_id
      in: query
      schema: { type: string, format: uuid }
    MetricName:
      name: name
      in: query
      description: Metric names, as in the plugin's manifest. Repeat for several.
      style: form
      explode: true
      schema: { type: array, items: { type: string }, maxItems: 50 }
    MetricObject:
      name: object
      in: query
      description: Object key within the check (interface index, VM UUID); empty for single-object checks.
      schema: { type: string }

  responses:
    Problem:
      description: An error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, description: "Stable URI per error, e.g. https://monitor.plusclouds.com/problems/tenant-suspended" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }

    ExternalRef:
      type: object
      required: [source, id]
      properties:
        source: { type: string }
        type: { type: [string, "null"] }
        id: { type: string }

    TenantLimits:
      type: object
      properties:
        max_devices: { type: integer, minimum: 0 }
        max_checks: { type: integer, minimum: 0 }
        max_webhooks: { type: integer, minimum: 0, description: "Webhook endpoints the tenant may create" }
        max_alert_routes: { type: integer, minimum: 0, description: "Alert routes the tenant may create" }
        min_check_interval_seconds: { type: integer, minimum: 1 }
        api_rate_per_minute: { type: integer, minimum: 0, description: "0 = unlimited" }
        allowed_target_networks:
          type: array
          description: Networks HTTP checks and webhooks may reach. Empty = everything except RFC 1918, loopback and link-local.
          items: { type: string }
        metric_classes:
          type: array
          items: { type: string }
        max_api_key_lifetime_days: { type: [integer, "null"], minimum: 1 }

    Tenant:
      type: object
      required: [id, name, status, is_platform, config_source, limits, external, provisioned, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [active, suspended, deleted, purged] }
        is_platform: { type: boolean }
        config_source: { type: string, enum: [api, file] }
        limits: { $ref: "#/components/schemas/TenantLimits" }
        external:
          oneOf:
            - $ref: "#/components/schemas/ExternalRef"
            - type: "null"
        provisioned: { type: string, enum: [api, jit, bootstrap] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TenantUpsert:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        external_type: { type: string, maxLength: 200 }
        limits:
          description: On create, missing fields come from the platform defaults. On update, missing fields stay unchanged.
          $ref: "#/components/schemas/TenantLimits"

    TenantPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [active, suspended] }
        limits: { $ref: "#/components/schemas/TenantLimits" }

    User:
      type: object
      required: [id, status, external]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: [string, "null"] }
        status: { type: string, enum: [active, disabled] }
        external:
          oneOf:
            - $ref: "#/components/schemas/ExternalRef"
            - type: "null"

    UserPatch:
      type: object
      properties:
        status: { type: string, enum: [active, disabled] }
        display_name: { type: [string, "null"], maxLength: 200 }

    Role:
      type: string
      enum: [read-only, operator, admin]

    Member:
      type: object
      required: [user, role, created_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }

    MemberUpsert:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        display_name: { type: [string, "null"], maxLength: 200 }

    Me:
      type: object
      required: [tenant, role, actor_kind]
      properties:
        tenant: { $ref: "#/components/schemas/Tenant" }
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        role: { type: string, enum: [read-only, operator, admin, platform] }
        actor_kind: { type: string, enum: [api_key, user, platform] }
        api_key_id: { type: string, format: uuid }

    APIKey:
      type: object
      required: [id, name, role, prefix, ip_allowlist, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        prefix: { type: string, description: "First part of the key, for recognizing it" }
        expires_at: { type: [string, "null"], format: date-time }
        ip_allowlist:
          type: array
          items: { type: string }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    APIKeyCreate:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: [string, "null"], format: date-time }
        ip_allowlist:
          type: array
          items: { type: string }

    APIKeyCreated:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key: { type: string, description: "The full key. Shown once." }

    Plugin:
      type: object
      required: [type, kind, description, config_schema, credential_types, credentials_required, metrics,
                 default_interval_seconds, min_interval_seconds, needs_raw_socket, billing_class]
      properties:
        type: { type: string }
        kind: { type: string, enum: [check, collector, ingester] }
        description: { type: string }
        config_schema:
          type: object
          description: JSON Schema (draft 2020-12) of the plugin's config.
        credential_types:
          type: array
          items: { type: string }
        credentials_required:
          type: boolean
          description: >-
            True when the plugin cannot run without a credential in the "auth" role. False when the
            credential is optional (e.g. an open RTSP stream) or the plugin takes none. The API does not
            enforce it: a check created without a required credential runs UNKNOWN until one is assigned.
        metrics:
          type: array
          items: { $ref: "#/components/schemas/MetricDef" }
        default_interval_seconds: { type: integer }
        min_interval_seconds: { type: integer }
        needs_raw_socket: { type: boolean }
        billing_class: { type: string, enum: [basic, standard, push, advanced, free] }
        whoopsy_metric: { type: string, description: "The metric Whoopsy! watches by default; absent when a check must name one" }

    MetricDef:
      type: object
      required: [name, unit, description, kind, retention_class]
      properties:
        name: { type: string }
        unit: { type: string }
        description: { type: string }
        kind: { type: string, enum: [gauge, rate] }
        retention_class: { type: string }

    AuditEvent:
      type: object
      required: [id, seq, at, actor, action, object_type]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [user, api_key, platform, admin-cli, file, system] }
            user_id: { type: [string, "null"], format: uuid }
            external_id: { type: [string, "null"] }
            api_key_id: { type: [string, "null"], format: uuid }
            detail: { type: [string, "null"] }
        action: { type: string }
        object_type: { type: string }
        object_id: { type: [string, "null"] }
        before: {}
        after: {}
        request_id: { type: [string, "null"] }
        source_ip: { type: [string, "null"] }

    ExternalRefWrite:
      type: object
      required: [source, id]
      properties:
        source: { type: string, minLength: 1, maxLength: 50 }
        type: { type: [string, "null"], maxLength: 200 }
        id: { type: string, minLength: 1, maxLength: 200 }

    CredentialType:
      type: object
      required: [name, description, fields_schema]
      properties:
        name: { type: string, examples: [snmp_v3] }
        description: { type: string }
        fields_schema:
          type: object
          description: JSON Schema of `fields`; secret fields are `writeOnly`.

    Credential:
      type: object
      required: [id, name, type, fields, secrets_set, managed_by, external, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        fields:
          type: object
          description: Non-secret fields only.
          additionalProperties: { type: string }
        secrets_set:
          type: array
          description: Names of the secret fields that have a value.
          items: { type: string }
        managed_by: { type: string }
        external:
          oneOf:
            - $ref: "#/components/schemas/ExternalRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CredentialWrite:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, description: "One of GET /v1/credential-types" }
        fields:
          type: object
          description: Field values, secret ones included. See the type's `fields_schema`.
          additionalProperties: { type: [string, "null"] }
        external: { $ref: "#/components/schemas/ExternalRefWrite" }

    Site:
      type: object
      required: [id, name, country, timezone, address, managed_by, external, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: [string, "null"], description: ISO 3166-1 alpha-2 }
        timezone: { type: [string, "null"], description: IANA time zone }
        address: { type: [string, "null"] }
        managed_by: { type: string }
        external:
          oneOf:
            - $ref: "#/components/schemas/ExternalRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SiteWrite:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        country: { type: string, pattern: "^[A-Z]{2}$", examples: [TR] }
        timezone: { type: string, examples: [Europe/Istanbul] }
        address: { type: string, maxLength: 1000 }
        external: { $ref: "#/components/schemas/ExternalRefWrite" }

    DeviceType:
      type: string
      enum: [network, server, bmc, camera, web, hypervisor_pool, hypervisor_host, vm, iot, ups, pdu,
             sensor, llm_endpoint, llm_application, other]

    Device:
      type: object
      required: [id, name, address, type, tags, notes, parent_id, site_id, physical_peer_id, inventory,
                 managed_by, external, status, discovered, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string, description: "IP, host name or URL" }
        type: { $ref: "#/components/schemas/DeviceType" }
        tags:
          type: object
          additionalProperties: { type: string }
        notes: { type: [string, "null"] }
        parent_id: { type: [string, "null"], format: uuid, description: "Container (ADR-0014)" }
        site_id: { type: [string, "null"], format: uuid }
        physical_peer_id: { type: [string, "null"], format: uuid, description: "Linked BMC or host" }
        inventory:
          type: object
          description: Vendor, model, serial and firmware, written by plugins.
        managed_by: { type: string, description: "`api`, `file`, or the collector that discovered it" }
        status: { $ref: "#/components/schemas/DeviceStatus" }
        external:
          oneOf:
            - $ref: "#/components/schemas/ExternalRef"
            - type: "null"
        discovered:
          type: [object, "null"]
          description: |
            Set when a collector (such as xapi.pool) discovered the device: a VM or a pool host. Such
            devices follow the collector (renamed, moved to the host a VM migrated to), do not count
            toward max_devices, are removed 7 days after the collector stops reporting them
            (`gone_at`), and are removed with the collector check.
          required: [check_id, key, gone_at]
          properties:
            check_id: { type: string, format: uuid, description: The collector check }
            key: { type: string, description: "The collector's key, e.g. vm:<uuid>" }
            gone_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DeviceWrite:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        address: { type: string, maxLength: 2000 }
        type: { $ref: "#/components/schemas/DeviceType" }
        tags:
          type: object
          maxProperties: 50
          additionalProperties: { type: string, maxLength: 200 }
        notes: { type: string, maxLength: 10000 }
        parent_id: { type: string, format: uuid }
        site_id: { type: string, format: uuid }
        physical_peer_id: { type: string, format: uuid }
        external: { $ref: "#/components/schemas/ExternalRefWrite" }

    DevicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Device" }
        next_cursor: { type: [string, "null"] }

    Dependency:
      type: object
      required: [device_id, depends_on_id, source]
      properties:
        device_id: { type: string, format: uuid }
        depends_on_id: { type: string, format: uuid }
        source: { type: string, description: "`api`, `containment`, or a discovery source such as `lldp`" }
        created_at: { type: [string, "null"], format: date-time }

    DependencyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Dependency" }

    ThresholdCondition:
      type: object
      required: [op, value]
      properties:
        op: { type: string, enum: [">", ">=", "<", "<=", "==", "!=", between, outside] }
        value: { type: number, format: double }
        value_max: { type: number, format: double, description: "Upper bound for between and outside" }

    ThresholdRule:
      type: object
      required: [metric]
      properties:
        id: { type: string, maxLength: 64, description: "Generated (r1, r2, ...) when missing" }
        name: { type: string, maxLength: 200 }
        metric: { type: string, description: "A metric of the check's plugin" }
        object: { type: string, description: "Collectors: `*` or an object key" }
        warning: { $ref: "#/components/schemas/ThresholdCondition" }
        critical: { $ref: "#/components/schemas/ThresholdCondition" }
        for: { type: string, description: "Condition must hold this long, e.g. 5m", examples: [5m] }
        hysteresis: { type: number, format: double, minimum: 0, description: "Margin to cross back before clearing" }

    Check:
      type: object
      required: [id, device_id, name, plugin, config, interval_seconds, timeout_seconds, enabled, thresholds,
                 failure_count, recovery_count, is_host_check, unknown_is_critical, runbook_url, credentials,
                 whoopsy, push, managed_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        name: { type: string }
        plugin: { type: string }
        config: { type: object }
        interval_seconds: { type: integer }
        timeout_seconds: { type: [integer, "null"] }
        enabled: { type: boolean }
        thresholds:
          type: array
          items: { $ref: "#/components/schemas/ThresholdRule" }
        failure_count: { type: integer }
        recovery_count: { type: integer }
        is_host_check: { type: boolean }
        unknown_is_critical: { type: boolean }
        runbook_url: { type: [string, "null"] }
        credentials:
          type: object
          description: "Credential ID per role, for example {\"auth\": \"…\"}"
          additionalProperties: { type: string, format: uuid }
        whoopsy:
          description: Whoopsy! settings; null when it is off. Changed only through `/checks/{check_id}/whoopsy`.
          oneOf:
            - { $ref: "#/components/schemas/Whoopsy" }
            - { type: "null" }
        push:
          description: Push checks (plugin kind `ingester`, e.g. `push.http`) only; null for polled checks.
          oneOf:
            - { $ref: "#/components/schemas/PushSource" }
            - { type: "null" }
        push_token:
          type: string
          description: |
            The push check's ingest token, only in the response that created it
            (create, `rotate-token`); never shown again. Devices send it as
            `Authorization: Bearer <token>`.
        managed_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PushSource:
      type: object
      required: [ingest_path, ingest_url, token_prefix, token_created_at, last_push_at]
      properties:
        ingest_path: { type: string, description: "/ingest/v1/{check_id} on the ingest listener" }
        ingest_url:
          type: [string, "null"]
          description: The full URL devices POST to; null when the server has no `ingest.http.public_url`.
        token_prefix: { type: string, description: The start of the current token, to tell tokens apart }
        token_created_at: { type: string, format: date-time }
        last_push_at: { type: [string, "null"], format: date-time, description: Time of the newest accepted message }

    Whoopsy:
      type: object
      additionalProperties: false
      description: |
        Whoopsy! (premium alerting): an alert when `metric` leaves its own
        band, the moving average of the last `window` results plus or minus
        `deviations` sample standard deviations, for `consecutive` results
        in a row. The band is at least `min_delta` wide on each side. Values
        that break the band do not enter the window: the band stays at the
        last normal, so an incident lasts until results return to it.
        `POST /checks/{check_id}/whoopsy/reset` accepts a new normal. A check with Whoopsy!
        is billed as `<plugin>+whoopsy` (the plugin's weight times
        `usage.whoopsy_multiplier`, default 5).
      properties:
        metric: { type: string, description: "Default: the plugin's whoopsy_metric (total_ms for http, rtt_avg_ms for icmp)" }
        window: { type: integer, minimum: 3, maximum: 1000, default: 7, description: Results in the band }
        deviations: { type: number, format: double, exclusiveMinimum: 0, maximum: 10, default: 1 }
        consecutive: { type: integer, minimum: 1, maximum: 100, default: 3, description: Results outside the band in a row before the alert }
        direction: { type: string, enum: [above, below, both], default: above }
        min_delta: { type: number, format: double, minimum: 0, default: 0, description: "Smallest half-width of the band, in the metric's unit" }
        severity: { type: string, enum: [warning, critical], default: warning }

    WhoopsyStatus:
      type: object
      required: [check_id, enabled, settings, band]
      properties:
        check_id: { type: string, format: uuid }
        enabled: { type: boolean }
        settings:
          oneOf:
            - { $ref: "#/components/schemas/Whoopsy" }
            - { type: "null" }
        band:
          type: [object, "null"]
          description: The engine's band after the last result; null until the check has a result with Whoopsy! on.
          required: [points, mean, stddev, lower, upper, last_value, consecutive_hits, alerting]
          properties:
            points: { type: integer, description: "Results in the window so far; the band applies once it reaches window" }
            mean: { type: [number, "null"], format: double }
            stddev: { type: [number, "null"], format: double }
            lower: { type: [number, "null"], format: double }
            upper: { type: [number, "null"], format: double }
            last_value: { type: [number, "null"], format: double }
            consecutive_hits: { type: integer }
            alerting: { type: boolean }

    CheckWrite:
      type: object
      required: [name, plugin]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        plugin: { type: string, description: "One of GET /v1/plugins" }
        config: { type: object, description: "Validated against the plugin's config_schema" }
        interval_seconds: { type: integer, minimum: 1, maximum: 86400, description: "Default: the plugin's" }
        timeout_seconds: { type: integer, minimum: 1, maximum: 300 }
        enabled: { type: boolean, default: true }
        thresholds:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/ThresholdRule" }
        failure_count: { type: integer, minimum: 1, maximum: 100, description: "Default 3; 1 for push checks, whose missed_count already waits" }
        recovery_count: { type: integer, minimum: 1, maximum: 100, default: 1 }
        is_host_check: { type: boolean, default: false, description: "The check that says whether the device is up" }
        unknown_is_critical: { type: boolean, default: false }
        runbook_url: { type: string, format: uri, maxLength: 2000 }
        credentials:
          type: object
          maxProperties: 10
          additionalProperties: { type: string, format: uuid }

    CheckPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Check" }
        next_cursor: { type: [string, "null"] }

    CheckRun:
      type: object
      required: [check_id, name, plugin, status, output, duration_ms, metrics, time]
      properties:
        check_id: { type: string, format: uuid }
        name: { type: string }
        plugin: { type: string }
        status: { type: string, enum: [OK, WARNING, CRITICAL, UNKNOWN] }
        output: { type: string }
        duration_ms: { type: number, format: double }
        metrics:
          type: object
          description: Metric values by name; null when not collected. Empty for collectors, whose metrics are per object.
          additionalProperties: { type: [number, "null"], format: double }
        time: { type: string, format: date-time }
        objects:
          type: array
          description: Collectors only. Null when the collection failed.
          items:
            type: object
            required: [key, name, status, output, metrics]
            properties:
              key: { type: string }
              name: { type: string }
              labels: { type: object, additionalProperties: { type: string } }
              status: { type: string, enum: [OK, WARNING, CRITICAL, UNKNOWN] }
              output: { type: string }
              metrics:
                type: object
                additionalProperties: { type: [number, "null"], format: double }

    CheckObject:
      type: object
      required: [key, name, labels, phase, status, since, last_status, last_output, last_metrics, incident_id,
                 device_id, first_seen_at, last_seen_at, gone_at]
      properties:
        key: { type: string, description: "Stable identifier within the check, e.g. the interface name" }
        name: { type: string }
        labels:
          type: object
          description: Descriptive values from the device, such as an interface's alias, type and speed.
          additionalProperties: { type: string }
        phase: { type: string, enum: [OK, PENDING, PROBLEM] }
        status: { type: string, enum: [OK, WARNING, CRITICAL, UNKNOWN], description: "Effective status: plugin and thresholds" }
        since: { type: string, format: date-time }
        last_status: { type: [string, "null"], description: "The plugin's own status of the object" }
        last_output: { type: [string, "null"] }
        last_metrics:
          type: object
          additionalProperties: { type: number, format: double }
        incident_id: { type: [string, "null"], format: uuid }
        device_id:
          type: [string, "null"]
          format: uuid
          description: The discovered device the object belongs to (a VM), when it is not the check's own device
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        gone_at: { type: [string, "null"], format: date-time, description: "When the device stopped reporting it" }

    CheckState:
      type: object
      required: [check_id, phase, status, since, last_result_at, last_status, last_output, last_metrics,
                 flapping, consecutive_bad, consecutive_good, incident_id, updated_at]
      properties:
        check_id: { type: string, format: uuid }
        phase: { type: string, enum: [OK, PENDING, PROBLEM] }
        status: { type: string, enum: [OK, WARNING, CRITICAL, UNKNOWN], description: "Effective status: plugin and thresholds" }
        since: { type: string, format: date-time, description: "When status last changed" }
        last_result_at: { type: [string, "null"], format: date-time }
        last_status: { type: [string, "null"], description: "The plugin's own status of the last result" }
        last_output: { type: [string, "null"] }
        last_metrics:
          type: object
          additionalProperties: { type: number, format: double }
        flapping: { type: boolean }
        consecutive_bad: { type: integer }
        consecutive_good: { type: integer }
        incident_id: { type: [string, "null"], format: uuid }
        updated_at: { type: string, format: date-time }

    Incident:
      type: object
      required: [id, check_id, device_id, object_key, object_name, severity, status, summary, last_output, rule_id,
                 rule_name, flapping, suppressed, root_incident_id, root_device_id, opened_at, acknowledged_at,
                 acknowledged_by, acknowledged_by_external_id, resolved_at, resolved_by, updated_at]
      properties:
        id: { type: string, format: uuid }
        check_id: { type: [string, "null"], format: uuid }
        device_id: { type: [string, "null"], format: uuid }
        object_key:
          type: [string, "null"]
          description: For a collector check, the object the incident is about (an interface, a fan); null for the check itself
        object_name: { type: [string, "null"], description: "The object's name when the incident opened" }
        severity: { type: string, enum: [warning, critical] }
        status: { type: string, enum: [open, acknowledged, resolved] }
        summary: { type: string }
        last_output: { type: [string, "null"] }
        rule_id: { type: [string, "null"], description: "The threshold rule that caused it, if any" }
        rule_name: { type: [string, "null"] }
        flapping: { type: boolean }
        suppressed:
          type: boolean
          description: |
            An upstream failure explains it (the device's own host check, a
            container or a dependency is down), so it is not notified. When
            the root recovers and this one still fails, it stops being
            suppressed and is notified with `monitoring.incident.opened`.
        root_incident_id:
          type: [string, "null"]
          format: uuid
          description: The incident that explains this one, while suppressed
        root_device_id:
          type: [string, "null"]
          format: uuid
          description: The root incident's device, or this incident's own; routes can group by it
        opened_at: { type: string, format: date-time }
        acknowledged_at: { type: [string, "null"], format: date-time }
        acknowledged_by: { type: [string, "null"], format: uuid, description: "User ID" }
        acknowledged_by_external_id: { type: [string, "null"] }
        resolved_at: { type: [string, "null"], format: date-time }
        resolved_by: { type: [string, "null"], enum: [recovery, manual, check-deleted, check-disabled, object-gone, null] }
        updated_at: { type: string, format: date-time }

    IncidentComment:
      type: object
      required: [id, author_kind, author_user_id, author_external_id, body, created_at]
      properties:
        id: { type: string, format: uuid }
        author_kind: { type: string }
        author_user_id: { type: [string, "null"], format: uuid }
        author_external_id: { type: [string, "null"] }
        body: { type: string }
        created_at: { type: string, format: date-time }

    Webhook:
      type: object
      required: [id, name, url, enabled, disabled_reason, timeout_seconds, header_names, previous_valid_until,
                 managed_by, external, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string }
        enabled: { type: boolean }
        disabled_reason: { type: [string, "null"], description: "Set when the engine disabled it, e.g. after 410 Gone" }
        timeout_seconds: { type: integer }
        header_names:
          type: array
          description: Names of the static extra headers; values are encrypted and never returned.
          items: { type: string }
        previous_valid_until: { type: [string, "null"], format: date-time, description: "Rotation overlap end" }
        managed_by: { type: string }
        external:
          oneOf:
            - $ref: "#/components/schemas/ExternalRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WebhookWithSecret:
      allOf:
        - $ref: "#/components/schemas/Webhook"
        - type: object
          properties:
            secret: { type: string, description: "Signing secret `whsec_…`. Shown once." }

    WebhookWrite:
      type: object
      required: [name, url]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, maxLength: 2000 }
        enabled: { type: boolean, default: true }
        timeout_seconds: { type: integer, minimum: 1, maximum: 30, default: 10 }
        headers:
          type: object
          maxProperties: 20
          description: Static extra headers, encrypted at rest. null removes one.
          additionalProperties: { type: [string, "null"], maxLength: 1000 }
        external: { $ref: "#/components/schemas/ExternalRefWrite" }

    WebhookAttempt:
      type: object
      required: [ok, status_code, response, error]
      properties:
        ok: { type: boolean }
        status_code: { type: [integer, "null"] }
        response: { type: string, description: "Start of the response body" }
        error: { type: [string, "null"] }

    WebhookDelivery:
      type: object
      required: [id, event_id, event_type, subject, route_id, status, attempts, next_attempt_at, last_attempt_at,
                 last_status_code, last_error, last_response, delivered_at, created_at]
      properties:
        id: { type: string, format: uuid }
        event_id: { type: string, format: uuid, description: "Also the webhook-id header" }
        event_type: { type: string }
        subject: { type: string }
        route_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [pending, delivered, failed, cancelled] }
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time }
        last_attempt_at: { type: [string, "null"], format: date-time }
        last_status_code: { type: [integer, "null"] }
        last_error: { type: [string, "null"] }
        last_response: { type: [string, "null"] }
        delivered_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    AlertRouteMatch:
      type: object
      description: Every set field must match; an empty match takes everything.
      properties:
        severity:
          type: array
          items: { type: string, enum: [warning, critical] }
        device_types:
          type: array
          items: { $ref: "#/components/schemas/DeviceType" }
        site_ids:
          type: array
          items: { type: string, format: uuid }
        tags:
          type: object
          additionalProperties: { type: string }
        event_types:
          type: array
          description: |
            Default: opened, updated, acknowledged and resolved incident events, and the
            account limit events. A limit event has no device, check or severity, so a route
            that filters on any of those does not deliver it.
          items:
            type: string
            enum: [monitoring.incident.opened, monitoring.incident.updated, monitoring.incident.acknowledged,
                   monitoring.incident.resolved, monitoring.incident.commented,
                   monitoring.tenant.device_limit_reached, monitoring.tenant.check_limit_reached]
        check_ids:
          type: array
          description: Only incidents of these checks (one alarm to its own webhook).
          maxItems: 100
          items: { type: string, format: uuid }
        device_ids:
          type: array
          description: Only incidents of checks on these devices.
          maxItems: 100
          items: { type: string, format: uuid }

    AlertRoute:
      type: object
      required: [id, name, position, enabled, match, endpoint_id, continue, labels, steps, group_by, group_wait_seconds,
                 repeat_interval_seconds, managed_by, external, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer, description: "Evaluation order, lowest first" }
        enabled: { type: boolean }
        match: { $ref: "#/components/schemas/AlertRouteMatch" }
        endpoint_id: { type: string, format: uuid }
        continue: { type: boolean, description: "Keep evaluating later routes after this one matched" }
        labels:
          type: object
          description: Sent as data.route.labels; the receiver decides what they mean (recipient, channel).
          additionalProperties: { type: string }
        group_by:
          type: array
          items: { $ref: "#/components/schemas/GroupField" }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RouteStep" }
        group_wait_seconds: { type: integer }
        repeat_interval_seconds: { type: [integer, "null"] }
        managed_by: { type: string }
        external:
          oneOf:
            - $ref: "#/components/schemas/ExternalRef"
            - type: "null"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AlertRouteWrite:
      type: object
      required: [name, endpoint_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        position: { type: integer, minimum: 1, description: "Default: after every other route" }
        enabled: { type: boolean, default: true }
        match: { $ref: "#/components/schemas/AlertRouteMatch" }
        endpoint_id: { type: string, format: uuid }
        continue: { type: boolean, default: false }
        labels:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 200 }
        group_by:
          type: array
          maxItems: 7
          description: |
            Collect matching events with the same values of these fields for
            `group_wait_seconds`, then send them as one event of the same type
            whose `data.objects` lists each incident (`object`, `device`,
            `check`) and `data.group` holds the key and count. A group of one
            is sent as the plain event. Empty: every event on its own.
            `root_device_id` groups a switch outage with the incidents it
            explains.
          items: { $ref: "#/components/schemas/GroupField" }
        steps:
          type: array
          maxItems: 10
          description: |
            Escalation. Step 0 is the notification itself; each later step is
            sent `after_seconds` after it as `monitoring.incident.escalated`,
            to this route only, with its labels in `data.route.labels` and
            its number in `data.route.step`, while the incident is open (and
            unacknowledged, for steps with `only_if_unacknowledged`). Empty:
            one step with the route's labels.
          items: { $ref: "#/components/schemas/RouteStep" }
        group_wait_seconds: { type: integer, minimum: 0, maximum: 600, default: 30 }
        repeat_interval_seconds:
          type: [integer, "null"]
          minimum: 300
          maximum: 604800
          description: |
            Re-send open, unacknowledged, unsuppressed incidents this often as
            `monitoring.incident.renotify`, to this route only. Null: never.
        external: { $ref: "#/components/schemas/ExternalRefWrite" }

    RouteTestResult:
      type: object
      required: [id, name, matched, notifies, endpoint_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        endpoint_id: { type: string, format: uuid }
        matched: { type: boolean }
        notifies: { type: boolean }

    RouteStep:
      type: object
      additionalProperties: false
      required: [after_seconds]
      properties:
        after_seconds:
          type: integer
          minimum: 0
          maximum: 604800
          description: After the incident was notified. The first step is the notification itself (0).
        labels:
          type: object
          maxProperties: 20
          description: Merged over the route's labels in data.route.labels
          additionalProperties: { type: string, maxLength: 200 }
        only_if_unacknowledged: { type: boolean, default: false }
        schedule:
          type: object
          additionalProperties: false
          required: [from, to]
          description: |
            Send this step only within these hours. Due outside them, it waits
            for the next window, unless the incident was resolved (or
            acknowledged, with only_if_unacknowledged) meanwhile. `to` before
            `from` spans midnight. Not allowed on the first step.
          properties:
            timezone: { type: string, default: UTC, examples: [Europe/Istanbul] }
            days:
              type: array
              items: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
            from: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", examples: ["08:00"] }
            to: { type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$", examples: ["18:00"] }

    GroupField:
      type: string
      enum: [root_device_id, device_id, site_id, severity, check_id, plugin, device_type]

    Availability:
      type: string
      enum: [up, down, unusual, unknown, unmonitored, disabled]

    DeviceStatus:
      type: object
      readOnly: true
      description: |
        Rolled-up state. availability comes from the device's host check
        (is_host_check): down while it is in PROBLEM, except unusual when
        the problem comes only from its Whoopsy! band (the check itself
        succeeds and no fixed threshold is breached: it works, but not as
        usual), up when OK or PENDING,
        unknown when UNKNOWN or without a result yet, disabled when the host
        check is disabled, unmonitored without a host check. health is the
        worst severity among open and acknowledged incidents.
      required: [availability, since, health, open_incidents]
      properties:
        availability: { $ref: "#/components/schemas/Availability" }
        since: { type: [string, "null"], format: date-time, description: "When availability last changed" }
        health: { type: string, enum: [ok, warning, critical] }
        open_incidents: { type: integer }

    MergePatch:
      type: object
      description: A JSON Merge Patch (RFC 7396) document.
      additionalProperties: true

    MetricSeries:
      type: object
      required: [id, device_id, check_id, plugin, object, name, unit, kind, retention_class]
      properties:
        id: { type: integer, format: int64 }
        device_id: { type: string, format: uuid }
        check_id: { type: string, format: uuid }
        plugin: { type: string }
        object: { type: string }
        name: { type: string }
        unit: { type: string }
        kind: { type: string, enum: [gauge, rate] }
        retention_class: { type: string }

    MetricPoint:
      type: object
      required: [t, v]
      properties:
        t: { type: string, format: date-time, description: Bucket start }
        v: { type: number, format: double }

    MetricQueryResult:
      type: object
      required: [resolution, step, series]
      properties:
        resolution: { type: string, enum: [raw, 5m, 1h] }
        step: { type: integer, description: Bucket size in seconds }
        series:
          type: array
          items: { $ref: "#/components/schemas/MetricQuerySeries" }

    MetricSummary:
      type: object
      required: [device_id, check_id, object, name, unit, count, min, max, avg, stddev, p50, p95, p99, percentiles,
                 last, last_at]
      description: Values are null when the window has no samples (and stddev also with one sample).
      properties:
        device_id: { type: string, format: uuid }
        check_id: { type: string, format: uuid }
        object: { type: string }
        name: { type: string }
        unit: { type: string }
        count: { type: integer, description: Raw samples in the window }
        min: { type: [number, "null"], format: double }
        max: { type: [number, "null"], format: double }
        avg: { type: [number, "null"], format: double }
        stddev: { type: [number, "null"], format: double, description: "Sample standard deviation (n-1)" }
        p50: { type: [number, "null"], format: double }
        p95: { type: [number, "null"], format: double }
        p99: { type: [number, "null"], format: double }
        percentiles:
          type: object
          description: Every percentile computed, by name (p50, p95, p99 and the asked ones). Linear interpolation between the closest ranks.
          additionalProperties: { type: number, format: double }
        last: { type: [number, "null"], format: double }
        last_at: { type: [string, "null"], format: date-time }
        moving:
          type: [object, "null"]
          description: With `window`, the mean and standard deviation of the last `window` samples.
          required: [window, count, avg, stddev]
          properties:
            window: { type: integer }
            count: { type: integer }
            avg: { type: [number, "null"], format: double }
            stddev: { type: [number, "null"], format: double }

    MetricQuerySeries:
      type: object
      required: [device_id, check_id, object, name, unit, series_ids, points]
      properties:
        device_id: { type: string, format: uuid }
        check_id: { type: string, format: uuid }
        object: { type: string }
        name: { type: string }
        unit: { type: string }
        series_ids:
          type: array
          items: { type: integer, format: int64 }
        points:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }

    RetentionWrite:
      type: object
      additionalProperties: false
      properties:
        raw_days: { type: [integer, "null"], minimum: 1, maximum: 36600 }
        rollup_5m_days: { type: [integer, "null"], minimum: 1, maximum: 36600 }
        rollup_1h_days: { type: [integer, "null"], minimum: 1, maximum: 36600 }

    RetentionClass:
      type: object
      required: [name, raw_days, rollup_5m_days, rollup_1h_days]
      properties:
        name: { type: string }
        raw_days: { type: [integer, "null"] }
        rollup_5m_days: { type: [integer, "null"] }
        rollup_1h_days: { type: [integer, "null"] }

    UsageHour:
      type: object
      required: [account_id, period_start, period_end, billable_check_seconds, device_seconds, revision, breakdown]
      properties:
        account_id:
          type: [string, "null"]
          description: The tenant's external ID (the PlusClouds account UUID) when the hour was closed
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        billable_check_seconds:
          type: number
          format: double
          description: Σ(seconds billable × plugin weight)
        device_seconds:
          type: integer
          format: int64
          description: Σ seconds devices existed; informational, not billed
        revision: { type: integer }
        breakdown:
          type: object
          additionalProperties:
            type: object
            required: [count_seconds, weight]
            properties:
              count_seconds: { type: integer, format: int64 }
              weight: { type: number, format: double }
