# mqtt.plusclouds.com: only the Let's Encrypt challenge for the MQTT broker's
# certificate (webroot renewal, see deploy/compose/mqtt-cert-hook.sh). MQTT
# itself (8883, 1883) goes straight to the container, not through nginx.
server {
    listen 80;
    server_name mqtt.plusclouds.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 404; }
}
