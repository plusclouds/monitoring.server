# golangci-lint v2 configuration (ADR-0011). gosec is required by the
# ISO 27001 mapping (A.8.28).
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/plusclouds/monitoring.server
